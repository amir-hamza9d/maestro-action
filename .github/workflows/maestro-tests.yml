name: Android E2E (Genymotion Cloud)

on:
  # workflow_dispatch:
  pull_request:
    branches: [main]

env:
  GM_ANDROID_14: 3990323a-1e9a-49df-ad87-6947f7fc166e

jobs:
  run_android_e2e:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    env:
      GMSAAS_INSTANCE_NAME: my-testing-device
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 60000 # setting 60 seconds timeout
      MAESTRO_CLOUD_API_KEY: "rb_1CcKRBzHIHJHZSX450ZFIFTBxTrS6COM30SohlNpfOjQaXnpBppaCjgG22KXUCotw0ul9i2LX8K7XaY4jQOnp60QNqS5Tih4Ret"
      MAESTRO_CLI_LOG_PATTERN_CONSOLE: "%highlight([%5level]) %msg%n"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11

      - name: Install Maestro (latest)
        run: curl -Ls https://get.maestro.mobile.dev | bash

      - name: Install Genymotion CLI
        run: |
          pip3 install gmsaas
          gmsaas config set android-sdk-path "$ANDROID_HOME"

      - name: Authenticate Genymotion
        run: gmsaas auth login amir.hamza@imaginationai.net 9Dtech@894

      - name: Start Genymotion Instance
        id: start_instance
        run: |
          INSTANCE_UUID=$(gmsaas instances start "${{ env.GM_ANDROID_14 }}" "${{ env.GMSAAS_INSTANCE_NAME }}")
          echo "instance_uuid=$INSTANCE_UUID" >> "$GITHUB_OUTPUT"
          echo "Waiting 15 seconds for instance to boot..."
          sleep 15

      - name: Connect Instance to ADB
        run: |
          gmsaas instances adbconnect "${{ steps.start_instance.outputs.instance_uuid }}"
          $ANDROID_HOME/platform-tools/adb devices

      - name: Run Android E2E Tests
        id: run_tests
        run: |
          pwd
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=60000 # setting 60 seconds timeout
          $ANDROID_HOME/platform-tools/adb install apps/android/pdf_viewer.apk

          # Make scripts executable
          chmod +x ./scripts/run_maestro_simple.sh
          chmod +x ./scripts/run_failed_tests.sh

          # Run tests using run_maestro_simple.sh which creates failed_tests.txt
          echo "🚀 Running Maestro tests with failed test tracking..."
          ./scripts/run_maestro_simple.sh
          TEST_STATUS=$?

          # Check if there are failed tests to retry
          if [ -s "failed_tests.txt" ]; then
            echo "⚠️ Found failed tests. Running retry logic..."
            ./scripts/run_failed_tests.sh
            RETRY_STATUS=$?
            if [ $RETRY_STATUS -ne 0 ]; then
              echo "❌ Tests failed even after retry"
              exit 1
            fi
          fi

          exit $TEST_STATUS

      - name: Stop Genymotion Instance
        if: always()
        continue-on-error: true
        run: |
          gmsaas instances stop --no-wait "${{ steps.start_instance.outputs.instance_uuid }}"
          gmsaas instances list

      - name: Setup Node.js for Visual Testing
        if: always()
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Visual Testing Dependencies
        if: always()
        run: npm install

      - name: Run Pixelmatch Visual Comparison
        if: always()
        continue-on-error: true
        run: |
          echo "🔍 Running pixelmatch visual regression testing..."
          node scripts/compare_screenshots.js

      - name: Run Applitools Visual Comparison
        if: always()
        continue-on-error: true
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          APPLITOOLS_APP_NAME: "PDF Viewer App"
          APPLITOOLS_BATCH_NAME: "E2E Visual Tests - ${{ github.run_number }}"
        run: |
          echo "👁️ Running Applitools visual testing..."
          if [ -z "$APPLITOOLS_API_KEY" ]; then
            echo "⚠️ APPLITOOLS_API_KEY not set. Skipping Applitools comparison."
            echo "ℹ️ To enable Applitools testing, add APPLITOOLS_API_KEY to your repository secrets."
          else
            node scripts/applitools_compare.js
          fi

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E Report
          path: |
            ${{ github.workspace }}/artifacts/**/*
            ${{ github.workspace }}/artifacts/*
            ${{ github.workspace }}/reports/**/*
            ${{ github.workspace }}/reports/*
            ${{ github.workspace }}/Screen-shots/**/*
            ${{ github.workspace }}/Screen-shots/*
